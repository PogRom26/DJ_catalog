<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">
        <a href="{% url 'catalog:home' %}" class="text-decoration-none text-dark fw-bold">
            <i class="bi bi-shop me-2"></i>Skystore
        </a>
    </h5>
    <nav class="ms-5">
        <div class="btn-group" role="group">
            <!-- Основные навигационные кнопки -->
            <a class="btn btn-custom-primary" href="{% url 'catalog:home' %}">
                <i class="bi bi-house me-1"></i>Главная
            </a>
            <a class="btn btn-custom-primary" href="{% url 'catalog:product_list' %}">
                <i class="bi bi-grid-3x3-gap me-1"></i>Все товары
            </a>
            <a class="btn btn-custom-primary" href="{% url 'catalog:contacts' %}">
                <i class="bi bi-telephone me-1"></i>Контакты
            </a>

            <!-- Дополнительные кнопки для авторизованных пользователей -->
            {% if user.is_authenticated %}
                <!-- Мои товары -->
                <a class="btn btn-outline-success" href="{% url 'catalog:my_products' %}">
                    <i class="bi bi-bag me-1"></i>Мои товары
                </a>

                <!-- Добавить товар -->
                <a class="btn btn-custom-primary" href="{% url 'catalog:product_create' %}">
                    <i class="bi bi-plus-circle me-1"></i>Добавить
                </a>

                <!-- Категории -->
                <a class="btn btn-outline-secondary" href="{% url 'catalog:category_list' %}">
                    <i class="bi bi-tags me-1"></i>Категории
                </a>

                <!-- Профиль и выход -->
                <div class="btn-group" role="group">
                    <a class="btn btn-outline-info" href="{% url 'users:profile' %}">
                        <i class="bi bi-person me-1"></i>{{ user.username|truncatechars:12 }}
                    </a>
                    <a class="btn btn-outline-danger" href="{% url 'users:logout' %}">
                        <i class="bi bi-box-arrow-right me-1"></i>
                    </a>
                </div>
            {% else %}
                <!-- Кнопки для анонимных пользователей -->
                <a class="btn btn-outline-success" href="{% url 'users:register' %}">
                    <i class="bi bi-person-plus me-1"></i>Регистрация
                </a>
                <a class="btn btn-outline-primary" href="{% url 'users:login' %}">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                </a>
            {% endif %}
        </div>
    </nav>
</div>
